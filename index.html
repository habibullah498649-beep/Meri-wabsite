<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level 1 - Gaon Race</title>
<style>
body{margin:0;background:#7ec850;text-align:center;font-family:sans-serif}
canvas{background:#8fd16a;border:3px solid #333;margin-top:10px}
button{padding:15px 25px;font-size:20px;margin:5px;border-radius:10px}
</style>
</head>
<body>
<h2>LEVEL 1 - GAON RACE</h2>
<canvas id="game" width="360" height="500"></canvas><br>
<button onclick="move('up')">⬆️ آگے</button><br>
<button onclick="move('left')">⬅️</button>
<button onclick="move('right')">➡️</button>
<button onclick="startSound()">🔊 آواز آن کرو</button>
<p id="msg">فنش لائن تک پہنچو!</p>

<script>
let c=document.getElementById("game");
let x=c.getContext("2d");
let carX=160, carY=420;
let audioCtx=null, osc=null;

function startSound(){
  if(!audioCtx){ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
  if(!osc){
    osc=audioCtx.createOscillator();
    let g=audioCtx.createGain();
    osc.type='sawtooth'; osc.frequency.value=80; g.gain.value=0.05;
    osc.connect(g); g.connect(audioCtx.destination); osc.start();
  }
  document.getElementById("msg").innerText="آواز آن ہو گئی! اب کار چلاؤ";
}

function draw(){
  x.clearRect(0,0,360,500);
  // Road
  x.fillStyle="#8a5a2b"; x.fillRect(120,0,120,500);
  x.fillStyle="#fff"; x.fillRect(175,0,10,500);
  // Grass / Fields
  x.fillStyle="#4caf50"; x.fillRect(0,0,120,500); x.fillRect(240,0,120,500);
  // Finish Line
  x.fillStyle="#fff"; x.fillRect(120,20,120,20);
  x.fillStyle="#000";
  for(let i=0;i<6;i++){ x.fillRect(120+i*20,20,10,10); x.fillRect(130+i*20,30,10,10); }
  x.fillStyle="#000"; x.font="bold 16px sans-serif"; x.fillText("FINISH",150,15);
  // Car
  x.fillStyle="red"; x.fillRect(carX,carY,40,60);
  x.fillStyle="#333"; x.fillRect(carX-5,carY+5,10,15); x.fillRect(carX+35,carY+5,10,15);
  x.fillRect(carX-5,carY+40,10,15); x.fillRect(carX+35,carY+40,10,15);
  x.fillStyle="white"; x.font="bold 18px sans-serif"; x.fillText("1",carX+15,carY+35);
}

function move(d){
  if(osc) osc.frequency.value=120+Math.random()*80;
  if(d=='up') carY-=20;
  if(d=='left') carX-=20;
  if(d=='right') carX+=20;
  if(carY<=40){
    document.getElementById("msg").innerText="جیت گئے! 🎉 Level 1 Complete!";
    if(osc) osc.frequency.value=300;
  }
  draw();
}
draw();
</script>
</body>
</html>
